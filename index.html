<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Studio Rita</title>

    <link rel="stylesheet" href="css/style.css">

<script type="module" src="src/app.js"></script>
</head>

<body>
    <h1>Agenda Studio Rita</h1>
    <main>
        <section id="agendar">
            <h2 id = "servicos-disponiveis">Serviços Disponíveis</h2>
        
            <div id="lista-servicos"></div>
            <!-- Os serviços são inseridos pelo javascript -->
        </section>
        <form id="form-agendamento">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text">

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel">

            <button type="submit">Agendar</button>
            <p id="mensagem-agendamento" role="status"></p>
        </form>
    </main>
</body>
</html>
